<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Panel - Food Delivery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding-bottom: 70px; color: #333; }
    header { background: #ff5722; color: #fff; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; font-size: 18px; font-weight: bold; }
    .container { padding: 12px; max-width: 600px; margin: auto; }
    .search-box { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
    .filter-btn-group { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
    .filter-btn { background: #e0e0e0; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .filter-btn.active { background: #ff5722; color: #fff; }
    
    .category-ribbon { background: linear-gradient(135deg, #ff6f00, #ff8f00); color: white; padding: 10px 15px; font-size: 16px; font-weight: bold; border-radius: 6px; margin: 15px 0 10px 0; display: flex; align-items: center; gap: 10px; }
    .category-ribbon img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    .dish-row { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; }
    .dish-num { font-weight: bold; color: #ff5722; font-size: 14px; }
    .dish-img-small { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    
    .qty-control { display: flex; align-items: center; gap: 6px; background: #f0f0f0; padding: 4px 8px; border-radius: 20px; }
    .qty-btn { background: #ff5722; color: #fff; border: none; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; cursor: pointer; }

    .btn { background: #ff5722; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-align: center; }
    .btn-secondary { background: #757575; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e0e0e0; z-index: 1000; }
    .nav-item { text-align: center; color: #666; font-size: 12px; cursor: pointer; }
    .nav-item.active { color: #ff5722; font-weight: bold; }
    .page { display: none; }
    .page.active { display: block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: bold; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .cart-bar { position: fixed; top: 52px; left: 0; right: 0; background: #2e7d32; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 999; }
    .hidden { display: none !important; }
    .order-card { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .hotel-card { background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); cursor: pointer; }
    .hotel-card img { width: 100%; height: 150px; object-fit: cover; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <header id="header-title">होटल एवं रेस्टोरेंट</header>

  <div id="cart-bar" class="cart-bar hidden">
    <span>कुल आइटम: <b id="cart-count">0</b> | कुल: ₹<b id="cart-total">0</b></span>
    <button class="btn" style="width:auto; background:white; color:#2e7d32; padding:6px 12px;" onclick="openCheckout()">Buy Now</button>
  </div>

  <div class="container">

    <!-- PAGE 1: HOME -->
    <div id="page-home" class="page active">
      <div id="hotel-list-view">
        <input type="text" id="hotel-search" class="search-box" placeholder="होटल/रेस्टोरेंट खोजें..." oninput="filterHotels()">
        <div id="hotels-container"></div>
      </div>

      <div id="dish-list-view" class="hidden">
        <button class="btn btn-secondary" style="margin-bottom: 10px; width: auto; padding:6px 12px;" onclick="backToHotels()">← वापस होटल लिस्ट</button>
        <h2 id="selected-hotel-name" style="margin-bottom: 10px; font-size:20px;"></h2>
        
        <input type="text" id="dish-search" class="search-box" placeholder="डिश खोजें..." oninput="filterDishes()">
        <div class="filter-btn-group">
          <button class="filter-btn active" onclick="setPriceFilter('all', this)">सभी</button>
          <button class="filter-btn" onclick="setPriceFilter(50, this)">₹50 से नीचे</button>
          <button class="filter-btn" onclick="setPriceFilter(100, this)">₹100 से नीचे</button>
        </div>

        <div id="menu-container"></div>
      </div>
    </div>

    <!-- CHECKOUT -->
    <div id="page-checkout" class="page">
      <h2>ऑर्डर जानकारी (Checkout)</h2><br>
      <div id="checkout-summary" style="background:#fff; padding:12px; border-radius:8px; margin-bottom:12px;"></div>
      
      <div class="form-group"><label>आपका नाम</label><input type="text" id="cust-name" placeholder="नाम"></div>
      <div class="form-group"><label>गली / स्ट्रीट का नाम</label><input type="text" id="cust-street" placeholder="गली या लैंडमार्क"></div>
      <div class="form-group"><label>पूरा पता (Address)</label><textarea id="cust-address" rows="3" placeholder="मकान नं, एरिया..."></textarea></div>
      <button class="btn btn-secondary" style="margin-bottom: 12px;" onclick="getCurrentLocation()">📍 Current Location चुनें (GPS)</button>
      <p id="location-status" style="font-size:12px; color:green; margin-bottom:12px;"></p>
      
      <button class="btn" onclick="placeOrder()">Order Place करें</button>
      <button class="btn btn-secondary" style="margin-top:8px;" onclick="showPage('home')">रद्द करें</button>
    </div>

    <!-- PAGE 2: ORDERS -->
    <div id="page-orders" class="page">
      <h2>मेरे ऑर्डर (Orders)</h2><br>
      <div id="orders-container"></div>
    </div>

    <!-- PAGE 3: PROFILE -->
    <div id="page-profile" class="page">
      <div id="auth-container">
        <div id="login-form">
          <h2>लॉगिन करें</h2><br>
          <div class="form-group"><label>Email ID</label><input type="email" id="login-email"></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-password"></div>
          <button class="btn" onclick="loginUser()">Enter (लॉगिन)</button><br><br>
          <button class="btn btn-secondary" onclick="toggleAuthForm('create')">Create New ID</button>
        </div>

        <div id="signup-form" class="hidden">
          <h2>नया अकाउंट बनाएं</h2><br>
          <div class="form-group"><label>Name</label><input type="text" id="reg-name"></div>
          <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
          <div class="form-group"><label>Password</label><input type="password" id="reg-password"></div>
          <div class="form-group"><label>Mobile Number</label><input type="text" id="reg-mobile" placeholder="+911234567890"></div>
          <button class="btn btn-secondary" onclick="sendOTP()">Send OTP</button>
          <div id="otp-section" class="hidden" style="margin-top: 12px;">
            <div class="form-group"><label>Enter OTP</label><input type="text" id="reg-otp"></div>
            <button class="btn" onclick="verifyAndCreate()">Create ID</button>
          </div>
        </div>
      </div>

      <div id="user-profile" class="hidden">
        <h2>प्रोफ़ाइल</h2><br>
        <div style="background:#fff; padding:15px; border-radius:8px;">
          <p><strong>Name:</strong> <span id="prof-name"></span></p>
          <p><strong>Email:</strong> <span id="prof-email"></span></p>
          <p><strong>Mobile:</strong> <span id="prof-mobile"></span></p><br>
          <button class="btn btn-secondary" onclick="logoutUser()">Logout</button>
        </div>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">Homepage</div>
    <div class="nav-item" id="nav-orders" onclick="showPage('orders')">Orders</div>
    <div class="nav-item" id="nav-profile" onclick="showPage('profile')">Profile</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYh83XSYKVdUnKh1OgBzuPOJRb9kNTxno",
      authDomain: "my-hotel-b7e45.firebaseapp.com",
      databaseURL: "https://my-hotel-b7e45-default-rtdb.firebaseio.com",
      projectId: "my-hotel-b7e45",
      storageBucket: "my-hotel-b7e45.firebasestorage.app",
      messagingSenderId: "766471367677",
      appId: "1:766471367677:web:6cb895ceecd170185a4794"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentHotels = [], currentCategories = [], currentDishes = [], cart = {}; 
    let selectedHotelId = null, selectedHotelName = "", gpsLocationStr = "", coordsObj = null, generatedOTP = null, currentPriceFilter = 'all', deliveredAlertsTrack = {};

    window.onload = () => { loadHotels(); listenAuth(); listenOrders(); };

    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${pageName}`).classList.add('active');
      document.getElementById(`nav-${pageName}`).classList.add('active');
    }

    function loadHotels() {
      db.ref('hotels').on('value', snapshot => {
        currentHotels = [];
        snapshot.forEach(child => { if(!child.val().hidden) currentHotels.push({ id: child.key, ...child.val() }); });
        renderHotels(currentHotels);
      });
    }

    function renderHotels(list) {
      const container = document.getElementById('hotels-container');
      container.innerHTML = "";
      if(list.length === 0) { container.innerHTML = "<p>कोई होटल उपलब्ध नहीं है।</p>"; return; }
      list.forEach(h => {
        container.innerHTML += `
          <div class="hotel-card" onclick="openHotel('${h.id}', '${h.name}')">
            <img src="${h.imageUrl || 'https://via.placeholder.com/300'}">
            <div style="padding:12px;"><h3>${h.name}</h3><button class="btn" style="margin-top:6px; padding:6px;">मेन्यू देखें</button></div>
          </div>`;
      });
    }

    function filterHotels() {
      const q = document.getElementById('hotel-search').value.toLowerCase();
      renderHotels(currentHotels.filter(h => h.name.toLowerCase().includes(q)));
    }

    function openHotel(hotelId, hotelName) {
      selectedHotelId = hotelId;
      selectedHotelName = hotelName;
      document.getElementById('selected-hotel-name').innerText = hotelName;
      document.getElementById('hotel-list-view').classList.add('hidden');
      document.getElementById('dish-list-view').classList.remove('hidden');

      db.ref('categories').on('value', snap => {
        currentCategories = [];
        snap.forEach(c => { if(c.val().hotelId === hotelId && !c.val().hidden) currentCategories.push({ id: c.key, ...c.val() }); });
        currentCategories.sort((a,b) => (Number(a.orderIndex)||0) - (Number(b.orderIndex)||0));
        renderMenu();
      });

      db.ref('dishes').on('value', snap => {
        currentDishes = [];
        snap.forEach(c => { if(c.val().hotelId === hotelId && !c.val().hidden) currentDishes.push({ id: c.key, ...c.val() }); });
        renderMenu();
      });
    }

    function backToHotels() {
      document.getElementById('hotel-list-view').classList.remove('hidden');
      document.getElementById('dish-list-view').classList.add('hidden');
      cart = {}; updateCartBar();
    }

    function setPriceFilter(limit, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPriceFilter = limit;
      renderMenu();
    }

    function filterDishes() { renderMenu(); }

    function renderMenu() {
      const q = document.getElementById('dish-search').value.toLowerCase();
      const container = document.getElementById('menu-container');
      container.innerHTML = "";
      let itemNumber = 1;

      currentCategories.forEach(cat => {
        let catDishes = currentDishes.filter(d => d.categoryId === cat.id);
        if(q) catDishes = catDishes.filter(d => d.name.toLowerCase().includes(q));
        if(currentPriceFilter !== 'all') catDishes = catDishes.filter(d => Number(d.price) <= Number(currentPriceFilter));

        if(catDishes.length > 0) {
          container.innerHTML += `<div class="category-ribbon">${cat.imageUrl ? `<img src="${cat.imageUrl}">` : ''}<span>${cat.name}</span></div>`;
          catDishes.forEach(dish => {
            const qty = cart[dish.id] ? cart[dish.id].qty : 0;
            container.innerHTML += `
              <div class="dish-row">
                <div class="dish-num">#${itemNumber++}</div>
                <img class="dish-img-small" src="${dish.imageUrl || 'https://via.placeholder.com/60'}">
                <div style="flex-grow:1;">
                  <div style="font-weight:bold;">${dish.name}</div>
                  <div style="color:#2e7d32; font-weight:bold;">₹${dish.price}</div>
                </div>
                <div class="qty-control">
                  ${qty > 0 ? `<button class="qty-btn" onclick="changeQty('${dish.id}', -1)">-</button><b>${qty}</b>` : ''}
                  <button class="qty-btn" onclick="changeQty('${dish.id}', 1)">+</button>
                </div>
              </div>`;
          });
        }
      });
    }

    function changeQty(dishId, change) {
      const dish = currentDishes.find(d => d.id === dishId);
      if(!dish) return;
      if(!cart[dishId]) cart[dishId] = { dish: dish, qty: 0 };
      cart[dishId].qty += change;
      if(cart[dishId].qty <= 0) delete cart[dishId];
      renderMenu(); updateCartBar();
    }

    function updateCartBar() {
      let totalQty = 0, totalPrice = 0;
      Object.values(cart).forEach(i => { totalQty += i.qty; totalPrice += (i.qty * Number(i.dish.price)); });
      const bar = document.getElementById('cart-bar');
      if(totalQty > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cart-count').innerText = totalQty;
        document.getElementById('cart-total').innerText = totalPrice;
      } else bar.classList.add('hidden');
    }

    function openCheckout() {
      if(!auth.currentUser) { alert("लॉगिन करें!"); showPage('profile'); return; }
      showPage('checkout');
      const summary = document.getElementById('checkout-summary');
      summary.innerHTML = "";
      let total = 0;
      Object.values(cart).forEach(i => {
        const sub = i.qty * Number(i.dish.price);
        total += sub;
        summary.innerHTML += `<p>${i.dish.name} x ${i.qty} = ₹${sub}</p>`;
      });
      summary.innerHTML += `<hr style="margin:6px 0;"><strong>होटल: ${selectedHotelName} | कुल: ₹${total}</strong>`;
    }

    function getCurrentLocation() {
      const status = document.getElementById('location-status');
      if (navigator.geolocation) {
        status.innerText = "GPS लोकेशन खोजी जा रही है...";
        navigator.geolocation.getCurrentPosition((pos) => {
          coordsObj = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          gpsLocationStr = `${pos.coords.latitude}, ${pos.coords.longitude}`;
          status.innerText = "GPS प्राप्त हो गया: " + gpsLocationStr;
        }, () => status.innerText = "GPS विफल।");
      }
    }

    function placeOrder() {
      const name = document.getElementById('cust-name').value;
      const street = document.getElementById('cust-street').value;
      const address = document.getElementById('cust-address').value;
      if(!name || !address) { alert("नाम और पता भरें!"); return; }

      const otp = Math.floor(1000 + Math.random() * 9000).toString();
      let totalPrice = 0, itemsList = [];
      Object.values(cart).forEach(i => {
        totalPrice += i.qty * Number(i.dish.price);
        itemsList.push({ name: i.dish.name, qty: i.qty, price: i.dish.price });
      });

      db.ref('orders').push().set({
        userId: auth.currentUser.uid,
        userName: name,
        hotelId: selectedHotelId,
        hotelName: selectedHotelName,
        street: street,
        address: address,
        gpsLocation: gpsLocationStr,
        coords: coordsObj,
        items: itemsList,
        totalPrice: totalPrice,
        deliveryOtp: otp,
        status: 'Pending',
        createdAt: firebase.database.ServerValue.TIMESTAMP
      }).then(() => {
        alert("आपका ऑर्डर प्लेस हो गया!");
        cart = {}; updateCartBar(); showPage('orders');
      });
    }

    function listenOrders() {
      auth.onAuthStateChanged(user => {
        if(user) {
          db.ref('orders').on('value', snapshot => {
            const container = document.getElementById('orders-container');
            container.innerHTML = "";
            snapshot.forEach(child => {
              const orderId = child.key, data = child.val();
              if(data.userId === user.uid) {
                if (data.status === 'Delivered' && !deliveredAlertsTrack[orderId]) {
                  deliveredAlertsTrack[orderId] = true;
                  alert(`Coupon Notification: ${data.hotelName || 'होटल'} का ऑर्डर #${orderId.slice(0,5)} डिलिवर हो गया है!`);
                }
                container.innerHTML += `
                  <div class="order-card">
                    <p><strong>Hotel:</strong> ${data.hotelName || 'N/A'}</p>
                    <p><strong>Status:</strong> ${data.status}</p>
                    <p><strong>Items:</strong> ${data.items ? data.items.map(i => i.name + ' x' + i.qty).join(', ') : ''}</p>
                    <p><strong>Total:</strong> ₹${data.totalPrice}</p>
                    ${data.status === 'Pending' ? `<div style="background:#e3f2fd; padding:4px; font-weight:bold; display:inline-block;">Delivery OTP: ${data.deliveryOtp}</div>` : ''}
                  </div>`;
              }
            });
          });
        }
      });
    }

    function listenAuth() {
      auth.onAuthStateChanged(user => {
        if(user) {
          document.getElementById('login-form').classList.add('hidden');
          document.getElementById('signup-form').classList.add('hidden');
          document.getElementById('user-profile').classList.remove('hidden');
          db.ref('users/' + user.uid).once('value').then(snap => {
            if(snap.exists()) {
              document.getElementById('prof-name').innerText = snap.val().name || '';
              document.getElementById('prof-email').innerText = snap.val().email || user.email;
              document.getElementById('prof-mobile').innerText = snap.val().mobile || '';
            }
          });
        } else {
          document.getElementById('login-form').classList.remove('hidden');
          document.getElementById('user-profile').classList.add('hidden');
        }
      });
    }

    function toggleAuthForm(t) {
      if(t === 'create') { document.getElementById('login-form').classList.add('hidden'); document.getElementById('signup-form').classList.remove('hidden'); }
      else { document.getElementById('signup-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden'); }
    }
    function sendOTP() {
      generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
      alert("OTP: " + generatedOTP);
      document.getElementById('otp-section').classList.remove('hidden');
    }
    function verifyAndCreate() {
      if(document.getElementById('reg-otp').value !== generatedOTP) { alert("गलत OTP!"); return; }
      auth.createUserWithEmailAndPassword(document.getElementById('reg-email').value, document.getElementById('reg-password').value)
        .then(res => db.ref('users/' + res.user.uid).set({ name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value, mobile: document.getElementById('reg-mobile').value }))
        .then(() => alert("अकाउंट बन गया!"));
    }
    function loginUser() { auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value); }
    function logoutUser() { auth.signOut(); }
  </script>
</body>
</html>
